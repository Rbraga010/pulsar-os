version: "3.9"

services:
  db:
    image: postgres:15
    container_name: pulsar-os-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsar_os
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme_set_in_env}
    ports:
      - "5433:5432"
    volumes:
      - pulsar-os-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar -d pulsar_os"]
      interval: 10s
      timeout: 3s
      retries: 5

  clara-bot:
    build: .
    container_name: pulsar-os-clara-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - bot/.env
    volumes:
      - ./bot:/data
    # tmux send-keys NAO funciona dentro do container · MVP usa host mode
    # Producao final via docker container nao suporta injecao tmux · usar systemd na host
    network_mode: "host"

volumes:
  pulsar-os-db-data:
